name: Build Camera Monitor APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      has_config: ${{ steps.config.outputs.present }}
    steps:
      - id: config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

  build-apk:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Restore real Firebase configuration
        if: needs.prepare.outputs.has_config == 'true'
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
      - name: Create placeholder Firebase configuration when secret is missing
        if: needs.prepare.outputs.has_config != 'true'
        run: |
          cat > app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "123456789012",
              "project_id": "family-location-tracker-8e2cd",
              "storage_bucket": "family-location-tracker-8e2cd.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:123456789012:android:0000000000000000000000",
                "android_client_info": { "package_name": "com.bharath.cameramonitor" }
              },
              "api_key": [{ "current_key": "AIzaSyDUMMYCONFIGFORCOMPILECHECKONLY000000000" }],
              "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
            }],
            "configuration_version": "1"
          }
          JSON
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Label build configuration
        run: |
          if [ "${{ needs.prepare.outputs.has_config }}" = "true" ]; then
            echo "APK_CONFIGURATION=real-firebase" >> "$GITHUB_ENV"
          else
            echo "APK_CONFIGURATION=placeholder-firebase" >> "$GITHUB_ENV"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: camera-monitor-debug-apk-${{ needs.prepare.outputs.has_config == 'true' && 'firebase-configured' || 'placeholder-firebase' }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Explain APK configuration
        run: |
          if [ "${{ needs.prepare.outputs.has_config }}" = "true" ]; then
            echo "Built APK with repository Firebase configuration."
          else
            echo "::warning::Built APK with placeholder Firebase configuration. It is for installation/UI testing only and will not connect to Firebase. Add GOOGLE_SERVICES_JSON and rerun for a functional APK."
          fi
